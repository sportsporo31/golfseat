<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>골프 모임 자리 선정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#122A1E;
    --bg-2:#0D2117;
    --panel:#1B3B2B;
    --paper:#F7F3E7;
    --paper-2:#ECE4CD;
    --ink:#1B2A20;
    --muted:#8FA898;
    --muted-2:#8C8264;
    --fairway:#3E8B57;
    --flag:#C0392B;
    --gold:#D4AF37;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    background:
      radial-gradient(circle at 15% 8%, rgba(62,139,87,0.18), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(212,175,55,0.10), transparent 45%),
      var(--bg);
    color:var(--paper);
    min-height:100vh;
  }
  .disp{ font-family:'Oswald','Noto Sans KR',sans-serif; text-transform:uppercase; }
  .wrap{ max-width:1120px; margin:0 auto; padding:36px 20px 60px; }

  header{ margin-bottom:26px; display:flex; align-items:flex-start; gap:14px; }
  .flag-mark{
    flex-shrink:0; width:46px; height:46px; border-radius:10px;
    background:var(--panel); border:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .eyebrow{ letter-spacing:.22em; font-size:12px; color:var(--gold); margin:0 0 5px; font-weight:600; }
  h1{ font-size:26px; margin:0 0 6px; color:var(--paper); letter-spacing:.01em; }
  .sub{ font-size:14px; color:var(--muted); margin:0; }

  .error-box{
    margin-bottom:16px; padding:12px 16px; border-radius:10px; font-size:14px;
    background:rgba(192,57,43,0.16); border:1px solid rgba(192,57,43,0.4); color:var(--paper);
    display:none;
  }
  .toast{
    margin-bottom:16px; padding:10px 16px; border-radius:10px; font-size:14px;
    background:rgba(62,139,87,0.28); border:1px solid rgba(62,139,87,0.5); color:var(--paper); display:none;
  }

  .grid{ display:grid; grid-template-columns:1fr; gap:24px; }
  @media(min-width:960px){ .grid{ grid-template-columns:2fr 3fr; } }

  .card{ background:var(--paper); color:var(--ink); border-radius:16px; padding:20px; position:relative; overflow:hidden; }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:repeating-linear-gradient(90deg, var(--fairway) 0 14px, var(--paper-2) 14px 28px);
  }
  .card-dark{ background:var(--panel); color:var(--paper); border-radius:16px; padding:20px; margin-top:16px; border:1px solid rgba(255,255,255,0.06); }

  .card h2{ font-size:16px; margin:14px 0 14px; display:flex; align-items:center; gap:8px; letter-spacing:.01em; }

  input[type=text]{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid #d9d0b0;
    font-size:14px; font-family:inherit; outline:none; margin-bottom:8px; background:#fff; color:var(--ink);
  }
  input[type=text]:focus{ border-color:var(--fairway); }
  input[type=number]{
    width:56px; padding:5px 8px; border-radius:8px; border:1px solid #d9d0b0; text-align:center; font-family:inherit;
  }
  .row-between{ display:flex; align-items:center; justify-content:flex-end; gap:8px; }

  button{ font-family:inherit; cursor:pointer; border:none; }
  .btn-dark{ background:var(--ink); color:#fff; padding:9px 16px; border-radius:9px; font-size:14px; font-weight:500; display:flex; align-items:center; gap:6px; }
  .btn-gold{ background:var(--gold); color:var(--ink); padding:12px 20px; border-radius:9px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; letter-spacing:.01em; }
  .btn-paper{ background:var(--paper); color:var(--ink); padding:12px 18px; border-radius:9px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .btn-ghost{ background:transparent; color:var(--muted); padding:12px 12px; border-radius:9px; }
  .btn-icon{ background:transparent; color:#a06050; padding:4px; display:flex; }

  .member-list{ max-height:320px; overflow-y:auto; padding-right:2px; margin-top:6px; display:flex; flex-direction:column; gap:5px; }
  .member-row{
    display:flex; align-items:center; justify-content:space-between; background:var(--paper-2);
    padding:9px 12px; border-radius:9px; font-size:14px;
  }
  .member-row .left{ display:flex; align-items:center; gap:9px; min-width:0; }
  .player-dot{
    flex-shrink:0; width:22px; height:22px; border-radius:50%; background:#fff;
    border:1px solid #d9d0b0; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.05);
    background-image:
      radial-gradient(circle, #e7e0c8 1px, transparent 1.2px);
    background-size: 6px 6px;
    background-position: 2px 2px;
  }
  .member-row .name{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty-hint{ font-size:13px; color:#9a8f74; text-align:center; padding:26px 0; }

  .divider-row{ margin-top:16px; padding-top:16px; border-top:1px dashed #d9d0b0; display:flex; align-items:center; justify-content:space-between; }
  .tsize-label{ font-size:14px; display:flex; align-items:center; gap:8px; }

  .hist-toggle{ width:100%; background:transparent; color:var(--paper); font-size:14px; font-weight:500; display:flex; align-items:center; justify-content:space-between; padding:0; }
  .hist-toggle .left{ display:flex; align-items:center; gap:8px; }
  .hist-body{ margin-top:12px; display:none; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }
  .hist-item{
    background:var(--bg-2); border-radius:9px; padding:8px 12px; font-size:12px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
  }
  .hist-item .date{ color:var(--gold); }
  .hist-item .meta{ color:var(--muted); }

  .actions-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }

  .empty-result{
    background:var(--panel); color:var(--muted); border-radius:16px; padding:48px 20px; text-align:center; font-size:14px;
    border:1px dashed rgba(255,255,255,0.12);
  }

  .result-grid{ display:grid; grid-template-columns:1fr; gap:16px; }
  @media(min-width:600px){ .result-grid{ grid-template-columns:1fr 1fr; } }

  .table-card{ background:var(--paper); color:var(--ink); border-radius:16px; padding:16px; position:relative; overflow:hidden; }
  .table-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--fairway);
  }
  .table-head{ display:flex; align-items:center; justify-content:space-between; margin:8px 0 12px; }
  .table-head .left{ display:flex; align-items:center; gap:10px; }

  .ball-badge{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:
      radial-gradient(circle at 30% 30%, #ffffff, #efe9d6 70%);
    background-size: 100% 100%, 7px 7px;
    box-shadow: inset -3px -3px 5px rgba(0,0,0,0.10), inset 2px 2px 3px rgba(255,255,255,0.7);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .ball-badge::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background-image: radial-gradient(circle, rgba(0,0,0,0.10) 1px, transparent 1.3px);
    background-size: 7px 7px;
    background-position: 3px 3px;
  }
  .ball-badge span{ position:relative; z-index:1; font-weight:800; font-size:14px; color:var(--ink); font-family:'Oswald',sans-serif; }

  .table-label{ font-size:13px; font-weight:700; color:var(--ink); letter-spacing:.01em; }
  .table-sub{ font-size:11px; color:var(--muted-2); }

  .seat-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
  .seat-list li{ display:flex; align-items:center; gap:8px; font-size:14px; padding:6px 8px; background:var(--paper-2); border-radius:8px; }
  .seat-list .seat-num{
    width:18px; height:18px; border-radius:4px; background:var(--ink); color:var(--paper);
    font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-family:'Oswald',sans-serif;
  }
  .seat-list .sname{ font-weight:600; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:#00000030; border-radius:4px; }

  /* ---- password gate ---- */
  #gateOverlay{
    position:fixed; inset:0; z-index:1000;
    background:
      radial-gradient(circle at 20% 20%, rgba(62,139,87,0.25), transparent 45%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .gate-box{
    background:var(--paper); color:var(--ink); border-radius:16px;
    padding:34px 28px; width:100%; max-width:340px; text-align:center;
    position:relative; overflow:hidden;
  }
  .gate-box::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:repeating-linear-gradient(90deg, var(--fairway) 0 14px, var(--paper-2) 14px 28px);
  }
  .gate-flag{ font-size:26px; margin-bottom:6px; }
  .gate-eyebrow{ letter-spacing:.22em; font-size:11px; color:var(--flag); margin:0 0 6px; font-weight:700; }
  .gate-title{ font-size:19px; font-weight:700; margin:8px 0 4px; }
  .gate-sub{ font-size:13px; color:var(--muted-2); margin:0 0 18px; }
  #gatePassword{
    width:100%; padding:12px; border-radius:9px; border:1px solid #d9d0b0;
    font-size:16px; font-family:inherit; outline:none; margin-bottom:10px; text-align:center;
    letter-spacing:.15em;
  }
  #gateBtn{
    width:100%; background:var(--ink); color:#fff; padding:12px; border-radius:9px;
    font-size:14px; font-weight:600;
  }
  #gateError{
    font-size:13px; color:var(--flag); margin-top:10px; min-height:16px; display:none;
  }
  #appRoot{ display:none; }
</style>
</head>
<body>

<div id="gateOverlay">
  <div class="gate-box">
    <div class="gate-flag">⛳</div>
    <p class="gate-eyebrow disp">Members Only</p>
    <p class="gate-title">비밀번호를 입력하세요</p>
    <p class="gate-sub">골프 모임 자리 선정 사이트예요.</p>
    <input type="password" id="gatePassword" placeholder="비밀번호" autocomplete="off" />
    <button id="gateBtn">입장하기</button>
    <p id="gateError">비밀번호가 올바르지 않아요.</p>
  </div>
</div>

<div id="appRoot">
<div class="wrap">
  <header>
    <div class="flag-mark">⛳</div>
    <div>
      <p class="eyebrow disp">Tee Time Grouping</p>
      <h1>골프 모임 자리 선정</h1>
      <p class="sub">새로운 조를 짜드려요.</p>
    </div>
  </header>

  <div class="error-box" id="errorBox"></div>

  <div class="grid">
    <!-- Left column -->
    <div>
      <div class="card">
        <h2>🏌️ 참가자 (<span id="memberCount">0</span>명)</h2>

        <input type="text" id="nameInput" placeholder="이름" />
        <div class="row-between" style="margin-bottom:14px;">
          <button class="btn-dark" id="addBtn">＋ 추가</button>
        </div>

        <div class="member-list" id="memberList"></div>

        <div class="divider-row">
          <label class="tsize-label">
            조당 인원
            <input type="number" id="tableSizeInput" min="2" max="8" value="4" />
            명
          </label>
        </div>
      </div>

      <div class="card-dark">
        <button class="hist-toggle" id="historyToggle">
          <span class="left">🕓 지난 기록 (<span id="histCount">0</span>)</span>
          <span id="histChevron">▾</span>
        </button>
        <div class="hist-body" id="historyBody"></div>
      </div>
    </div>

    <!-- Right column -->
    <div>
      <div class="actions-row">
        <button class="btn-gold" id="generateBtn">🏌️‍♂️ 조 배정하기</button>
        <button class="btn-paper" id="saveBtn" style="display:none;">💾 이번 조 편성 저장</button>
        <button class="btn-ghost" id="clearResultBtn" style="display:none;" title="결과 지우기">↺</button>
      </div>

      <div class="toast" id="toast"></div>

      <div class="empty-result" id="emptyResult">
        참가자를 등록하고 [조 배정하기]를 눌러보세요.
      </div>

      <div class="result-grid" id="resultGrid" style="display:none;"></div>
    </div>
  </div>
</div>
</div>

<script>
const SITE_PASSWORD = "1234";

function initGate(){
  const overlay = document.getElementById('gateOverlay');
  const appRoot = document.getElementById('appRoot');
  const pwInput = document.getElementById('gatePassword');
  const gateBtn = document.getElementById('gateBtn');
  const gateError = document.getElementById('gateError');

  function tryUnlock(){
    if(pwInput.value === SITE_PASSWORD){
      overlay.style.display = 'none';
      appRoot.style.display = 'block';
      loadData();
    } else {
      gateError.style.display = 'block';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  gateBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  pwInput.focus();
}

const MEMBERS_KEY = "seating_members_v1";
const HISTORY_KEY = "seating_history_v1";
const REPEAT_WEIGHT = 3;

let members = [];
let history = [];
let lastResult = null; // array of arrays of member ids

// ---------- storage helpers (browser localStorage) ----------
async function loadData(){
  try{
    const m = localStorage.getItem(MEMBERS_KEY);
    if(m) members = JSON.parse(m);
  }catch(e){}
  try{
    const h = localStorage.getItem(HISTORY_KEY);
    if(h) history = JSON.parse(h);
  }catch(e){}
  renderMembers();
  renderHistory();
}

async function persistMembers(){
  try{
    localStorage.setItem(MEMBERS_KEY, JSON.stringify(members));
  }catch(e){
    showError("저장에 실패했어요. 브라우저 저장 공간을 확인해주세요.");
  }
}

async function persistHistory(){
  try{
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }catch(e){
    showError("저장에 실패했어요. 브라우저 저장 공간을 확인해주세요.");
  }
}

function showError(msg){
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
  setTimeout(()=>{ box.style.display='none'; }, 4000);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
}
function hideToast(){
  document.getElementById('toast').style.display = 'none';
}

// ---------- utils ----------
function uid(){ return Math.random().toString(36).slice(2,10); }
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pairKey(a,b){ return a<b ? a+"_"+b : b+"_"+a; }

// ---------- grouping algorithm ----------
function buildPairCounts(hist){
  const counts = {};
  hist.forEach(session=>{
    session.tables.forEach(table=>{
      for(let i=0;i<table.length;i++){
        for(let j=i+1;j<table.length;j++){
          const k = pairKey(table[i], table[j]);
          counts[k] = (counts[k]||0)+1;
        }
      }
    });
  });
  return counts;
}

function tableCost(table, pairCounts){
  let cost=0;
  for(let i=0;i<table.length;i++){
    for(let j=i+1;j<table.length;j++){
      const k = pairKey(table[i], table[j]);
      cost += (pairCounts[k]||0) * REPEAT_WEIGHT;
    }
  }
  return cost;
}

function totalCost(tables, pairCounts){
  return tables.reduce((sum,t)=> sum + tableCost(t, pairCounts), 0);
}

function optimizeGroups(ids, pairCounts, groupSize){
  const n = ids.length;
  if(n===0) return [];
  const numGroups = Math.max(1, Math.ceil(n/groupSize));

  let best=null, bestCost=Infinity;
  const restarts = Math.min(40, 15+n);

  for(let r=0;r<restarts;r++){
    const shuffled = shuffle(ids);
    const tables = Array.from({length:numGroups}, ()=>[]);
    shuffled.forEach((id,idx)=> tables[idx%numGroups].push(id));

    let cost = totalCost(tables, pairCounts);
    const iterations = 600;
    for(let iter=0; iter<iterations; iter++){
      if(numGroups<2) break;
      const t1 = Math.floor(Math.random()*numGroups);
      let t2 = Math.floor(Math.random()*numGroups);
      while(t2===t1) t2 = Math.floor(Math.random()*numGroups);
      if(tables[t1].length===0 || tables[t2].length===0) continue;
      const i1 = Math.floor(Math.random()*tables[t1].length);
      const i2 = Math.floor(Math.random()*tables[t2].length);

      const before = tableCost(tables[t1], pairCounts) + tableCost(tables[t2], pairCounts);
      const tmp = tables[t1][i1];
      tables[t1][i1] = tables[t2][i2];
      tables[t2][i2] = tmp;
      const after = tableCost(tables[t1], pairCounts) + tableCost(tables[t2], pairCounts);

      if(after <= before){
        cost = cost - before + after;
      } else {
        const tmp2 = tables[t1][i1];
        tables[t1][i1] = tables[t2][i2];
        tables[t2][i2] = tmp2;
      }
    }

    if(cost < bestCost){
      bestCost = cost;
      best = tables.map(t=>[...t]);
    }
  }
  return best;
}

function generateSeating(members, history, groupSize){
  const ids = members.map(m=>m.id);
  const pairCounts = buildPairCounts(history);
  const groups = optimizeGroups(ids, pairCounts, groupSize) || [];
  return groups.filter(g=>g.length>0);
}

// ---------- rendering ----------
function renderMembers(){
  document.getElementById('memberCount').textContent = members.length;
  const list = document.getElementById('memberList');
  list.innerHTML = '';

  if(members.length===0){
    list.innerHTML = '<div class="empty-hint">아직 등록된 참가자가 없어요.</div>';
    return;
  }

  members.forEach(m=>{
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = `
      <div class="left">
        <span class="player-dot"></span>
        <span class="name">${escapeHtml(m.name)}</span>
      </div>
      <button class="btn-icon" data-id="${m.id}">🗑</button>
    `;
    row.querySelector('button').addEventListener('click', ()=> removeMember(m.id));
    list.appendChild(row);
  });
}

function renderHistory(){
  document.getElementById('histCount').textContent = history.length;
  const body = document.getElementById('historyBody');
  body.innerHTML = '';

  if(history.length===0){
    body.innerHTML = '<div style="font-size:12px;color:var(--muted);">아직 저장된 기록이 없어요.</div>';
    return;
  }

  [...history].reverse().forEach(s=>{
    const item = document.createElement('div');
    item.className = 'hist-item';
    const dateStr = new Date(s.date).toLocaleDateString('ko-KR');
    const peopleCount = s.tables.flat().length;
    item.innerHTML = `
      <div>
        <div class="date">${dateStr}</div>
        <div class="meta">${s.tables.length}개 조 · ${peopleCount}명</div>
      </div>
      <button class="btn-icon" data-id="${s.id}">🗑</button>
    `;
    item.querySelector('button').addEventListener('click', ()=> deleteSession(s.id));
    body.appendChild(item);
  });
}

function renderResult(){
  const emptyBox = document.getElementById('emptyResult');
  const grid = document.getElementById('resultGrid');
  const saveBtn = document.getElementById('saveBtn');
  const clearBtn = document.getElementById('clearResultBtn');

  if(!lastResult){
    emptyBox.style.display = 'block';
    grid.style.display = 'none';
    saveBtn.style.display = 'none';
    clearBtn.style.display = 'none';
    return;
  }

  emptyBox.style.display = 'none';
  grid.style.display = 'grid';
  saveBtn.style.display = 'flex';
  clearBtn.style.display = 'flex';

  const membersById = {};
  members.forEach(m=> membersById[m.id]=m);

  grid.innerHTML = '';
  lastResult.forEach((group, idx)=>{
    const card = document.createElement('div');
    card.className = 'table-card';

    const seatItems = group.map((id, seatIdx)=>{
      const m = membersById[id];
      if(!m) return '';
      return `<li><span class="seat-num">${seatIdx+1}</span><span class="sname">${escapeHtml(m.name)}</span></li>`;
    }).join('');

    card.innerHTML = `
      <div class="table-head">
        <div class="left">
          <div class="ball-badge"><span>${idx+1}</span></div>
          <div>
            <div class="table-label">${idx+1}조</div>
            <div class="table-sub">GROUP ${idx+1}</div>
          </div>
        </div>
      </div>
      <ul class="seat-list">${seatItems}</ul>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- actions ----------
function addMember(){
  const nameInput = document.getElementById('nameInput');
  const name = nameInput.value.trim();

  if(!name){
    showError('이름을 입력해주세요.');
    nameInput.focus();
    return;
  }

  members.push({ id: uid(), name });
  persistMembers();
  renderMembers();

  nameInput.value = '';
  nameInput.focus();
}

function removeMember(id){
  members = members.filter(m=>m.id!==id);
  persistMembers();
  renderMembers();
  lastResult = null;
  renderResult();
}

function handleGenerate(){
  if(members.length===0){
    showError('먼저 참가자를 추가해주세요.');
    return;
  }
  const groupSize = Math.max(2, Math.min(8, Number(document.getElementById('tableSizeInput').value) || 4));
  lastResult = generateSeating(members, history, groupSize);
  hideToast();
  renderResult();
}

function handleSaveSession(){
  if(!lastResult) return;
  const session = {
    id: uid(),
    date: new Date().toISOString(),
    tables: lastResult
  };
  history.push(session);
  persistHistory();
  renderHistory();
  showToast('이번 조 편성을 기록에 저장했어요. 다음 배정부터 반영됩니다.');
}

function deleteSession(id){
  history = history.filter(s=>s.id!==id);
  persistHistory();
  renderHistory();
}

// ---------- init ----------
document.getElementById('addBtn').addEventListener('click', addMember);
document.getElementById('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addMember(); });

document.getElementById('generateBtn').addEventListener('click', handleGenerate);
document.getElementById('saveBtn').addEventListener('click', handleSaveSession);
document.getElementById('clearResultBtn').addEventListener('click', ()=>{ lastResult=null; renderResult(); });

document.getElementById('tableSizeInput').addEventListener('change', e=>{
  let v = Math.max(2, Math.min(8, Number(e.target.value) || 4));
  e.target.value = v;
});

const historyToggle = document.getElementById('historyToggle');
const historyBody = document.getElementById('historyBody');
const histChevron = document.getElementById('histChevron');
let historyOpen = false;
historyToggle.addEventListener('click', ()=>{
  historyOpen = !historyOpen;
  historyBody.style.display = historyOpen ? 'flex' : 'none';
  histChevron.textContent = historyOpen ? '▴' : '▾';
});

initGate();
</script>
</body>
</html>
